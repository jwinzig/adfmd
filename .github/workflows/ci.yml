name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        if: matrix.python-version != '3.10'
        run: pytest

      - name: Measure line and branch coverage
        if: matrix.python-version == '3.10'
        run: pytest --cov --cov-report=term-missing --cov-report=xml --cov-report=json --cov-report=html

      - name: Summarize coverage
        if: matrix.python-version == '3.10'
        run: |
          python - <<'PY'
          import json
          import os

          with open("coverage.json", encoding="utf-8") as report:
              totals = json.load(report)["totals"]

          line_coverage = totals["percent_statements_covered"]
          branch_coverage = totals["percent_branches_covered"]

          print(f"Line coverage: {line_coverage:.2f}%")
          print(f"Branch coverage: {branch_coverage:.2f}%")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(
                  "## Coverage analysis\n\n"
                  "| Metric | Covered | Total | Coverage | Requirement |\n"
                  "| --- | ---: | ---: | ---: | ---: |\n"
                  f"| Lines | {totals['covered_lines']} | {totals['num_statements']} | "
                  f"{line_coverage:.2f}% | ≥ 90.00% |\n"
                  f"| Branches | {totals['covered_branches']} | {totals['num_branches']} | "
                  f"{branch_coverage:.2f}% | Report only |\n\n"
              )
          PY

      - name: Enforce line coverage
        if: matrix.python-version == '3.10'
        run: |
          python - <<'PY'
          import json

          with open("coverage.json", encoding="utf-8") as report:
              line_coverage = json.load(report)["totals"]["percent_statements_covered"]

          if line_coverage < 90:
              raise SystemExit(f"Line coverage {line_coverage:.2f}% is below 90.00%")
          PY

      - name: Enforce patch coverage
        if: matrix.python-version == '3.10' && github.event_name == 'pull_request'
        run: |
          diff-cover coverage.xml \
            --compare-branch="origin/${{ github.base_ref }}" \
            --format markdown:patch-coverage.md \
            --fail-under=90
          cat patch-coverage.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifact
        if: ${{ !cancelled() && matrix.python-version == '3.10' && hashFiles('coverage.xml') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-python-3.10
          path: |
            coverage.xml
            coverage.json
            patch-coverage.md
            htmlcov/
          retention-days: 14

  build:
    name: Build package
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build sdist and wheel
        run: python -m build

      - name: Check package metadata
        run: twine check dist/*
