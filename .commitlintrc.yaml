# Match the types allowed by the PR-title job in
# .github/workflows/conventional-commits.yml.
# Do not extend @commitlint/config-conventional: its subject-case and
# header-max-length rules are stricter than the PR-title action.
rules:
  type-empty: [2, never]
  subject-empty: [2, never]
  type-enum:
    - 2
    - always
    - - feat
      - fix
      - docs
      - test
      - refactor
      - perf
      - build
      - ci
      - chore
